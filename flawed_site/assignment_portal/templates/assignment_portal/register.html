<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
</head>

<body>

    <h1>Create account</h1>
    {% if error %}
    <ul>
        {% for message in error %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <form method="post">

        {% csrf_token %}

        <p>
            <label>
                Username:
            </label>

            <input
                type="text"
                name="username"
                value="{{ username }}"
                required
            >
        </p>

        <p>
            <label>
                Password:
            </label>

            <input
                type="password"
                name="password"
                required
            >
        </p>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">
            Log in
        </a>
    </p>

</body>

</html>
